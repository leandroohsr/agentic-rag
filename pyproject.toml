[project]
name = "agentic-rag"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "langchain>=1.5.0",
    "langchain-anthropic>=1.7.10",
    "langchain-chroma>=1.1.0",
    "langchain-ollama>=1.1.0",
    "langchain-openai>=1.7.4",
    "langchain-tavily>=0.2.18",
    "langchain-text-splitters>=1.1.3",
    "langchain-unstructured>=1.0.1",
    "langchainhub>=0.1.21",
    "langgraph>=1.2.20",
    "pytest>=9.2.0",
    "python-dotenv>=1.2.4",
    "ruff>=0.17.4",
    "tavily-python>=0.8.5",
    "unstructured>=0.27.37",
]

[project.scripts]
agentic-rag = "agentic_rag:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"
